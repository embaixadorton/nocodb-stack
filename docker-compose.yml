version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nocodb-postgres
    restart: unless-stopped
    networks:
      - nocodb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb_user
      POSTGRES_PASSWORD: NocoDB_Pg_2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb_user -d nocodb"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nocodb:
    image: nocodb/nocodb:0.202.6
    container_name: nocodb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nocodb
    volumes:
      - nocodb-data:/usr/app/data
    environment:
      NC_AUTH_JWT_SECRET: VY/AbMPGMNa9ChRWlKzBwA5SPLeuiVFmWhvq4f8gCPDDbVvvVkhOySvFt6hXP4ba
      NC_PUBLIC_URL: https://nocodb.embaixadorton.com.br
      NC_DISABLE_TELEMETRY: true
      NC_DB: pg://nocodb_user:NocoDB_Pg_2026@postgres:5432/nocodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nocodb"
      - "traefik.http.routers.nocodb.rule=Host(`nocodb.embaixadorton.com.br`)"
      - "traefik.http.routers.nocodb.entrypoints=websecure"
      - "traefik.http.routers.nocodb.tls.certresolver=leresolver"
      - "traefik.http.services.nocodb.loadbalancer.server.port=8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  nocodb-data:
    driver: local

networks:
  nocodb:
    external: true
