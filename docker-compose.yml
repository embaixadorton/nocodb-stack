version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - ${NETWORK_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nocodb:
    image: nocodb/nocodb:${NOCODB_VERSION}
    container_name: ${NOCODB_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ${NETWORK_NAME}
    volumes:
      - nocodb-data:/usr/app/data
    environment:
      NC_AUTH_JWT_SECRET: ${NOCODB_JWT_SECRET}
      NC_PUBLIC_URL: ${NOCODB_PUBLIC_URL}
      NC_DISABLE_TELEMETRY: ${NOCODB_DISABLE_TELEMETRY}
      NC_DB_TYPE: pg
      NC_DB_HOST: postgres
      NC_DB_PORT: 5432
      NC_DB_USER: ${POSTGRES_USER}
      NC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NC_DB_DATABASE: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/', (res) => {process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_NAME}"
      - "traefik.http.routers.nocodb.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.nocodb.entrypoints=websecure"
      - "traefik.http.routers.nocodb.tls.certresolver=leresolver"
      - "traefik.http.services.nocodb.loadbalancer.server.port=${NOCODB_PORT}"

volumes:
  postgres-data:
  nocodb-data:

networks:
  ${NETWORK_NAME}:
    external: true
